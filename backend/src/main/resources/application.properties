spring.application.name=safework

# El esquema lo gobierna Flyway, nunca Hibernate: una tabla creada sola es una
# tabla que no existe en ningún sitio salvo en la máquina de quien la creó.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Los identificadores los pone la aplicación, no la base: un permiso se crea en
# un teléfono sin señal y tiene que tener id desde ese momento.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info,modulith
management.endpoint.health.show-details=when-authorized
