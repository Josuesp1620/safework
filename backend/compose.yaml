services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: safework
      POSTGRES_USER: safework
      POSTGRES_PASSWORD: safework
    ports:
      - '5432:5432'
    volumes:
      - safework-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U safework']
      interval: 5s
      retries: 10

volumes:
  safework-db:
